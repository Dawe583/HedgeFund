[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.136.3",
    "justetf-scraping",
    "mcp>=2.2.0",
    "mstarpy>=11.0.1",
    "openai>=2.41.0",
    "httpx>=0.28",
    "numpy>=2.1",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "websockets>=13.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.50",
    "uvicorn[standard]>=0.48.0",
    "yfinance>=1.7.0",
    "nautilus-trader==1.231.0",
    "scikit-learn>=1.9.1",
    "ccxt>=4.5.94",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_trading"]
# Make the `app` package importable when running pytest from backend/.
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv.sources]
justetf-scraping = { git = "https://github.com/druzsan/justetf-scraping.git" }
